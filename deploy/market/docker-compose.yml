# market 服务端编排：直接使用镜像仓库里的镜像。
#   MARKET_IMAGE=registry.example.com/volund/volund-market:1.0.0 \
#   MARKET_ADMIN_TOKEN=xxx \
#   docker compose -f deploy/market/docker-compose.yml up -d
services:
  market:
    image: registry.cn-hangzhou.aliyuncs.com/future-coding-backend/volund-market:latest
    container_name: volund-market
    restart: unless-stopped
    ports:
      - '4315:4315'
    environment:
      PORT: 4315
      MARKET_ADMIN_TOKEN: ${MARKET_ADMIN_TOKEN:?在 .env 或环境变量里设置 MARKET_ADMIN_TOKEN}
    volumes:
      - market-data:/app/data

volumes:
  market-data:
