[workspace]
members = ["crates/volund-sandbox", "crates/volund-search", "crates/volund-fs"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.71"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
thiserror = "2"
encoding_rs = "0.8"
globset = "=0.4.15"
ignore = "=0.4.23"
regex = "1"
similar = "2"
tiktoken-rs = "0.6"
tree-sitter = "0.22"
tree-sitter-javascript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
