name: Docs

on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'typedoc.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'typedoc.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/docs/api 是 gitignore 的 typedoc 生成物：test 校验生成 prose，
      # 必须先于 test 生成（vitepress build 会在自身流程里再次生成，保持幂等）。
      - run: pnpm --filter @volund/docs exec typedoc --options ../../typedoc.json
      - run: pnpm --filter @volund/docs test
      - run: pnpm --filter @volund/docs build
      - if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
