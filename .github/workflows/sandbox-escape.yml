name: L2 sandbox escape (8 targets)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  escape:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, verification: native }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, verification: native }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, verification: native }
          - {
              runner: ubuntu-24.04,
              target: aarch64-unknown-linux-gnu,
              verification: partial-verified,
            }
          - {
              runner: ubuntu-24.04,
              target: x86_64-unknown-linux-musl,
              verification: cross-verified,
            }
          - {
              runner: ubuntu-24.04,
              target: aarch64-unknown-linux-musl,
              verification: partial-verified,
            }
          - {
              runner: windows-2022,
              target: x86_64-pc-windows-msvc,
              verification: native-tier2,
            }
          - {
              runner: windows-11-arm,
              target: aarch64-pc-windows-msvc,
              verification: native-tier2,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.verification == 'partial-verified'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Components:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe' | sudo tee /etc/apt/sources.list.d/arm64.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe' | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-arm64-cross libcap2:arm64
          sudo cp -a /usr/lib/aarch64-linux-gnu/libcap.so.2* /usr/aarch64-linux-gnu/lib/
      - if: matrix.verification == 'partial-verified'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - if: matrix.verification == 'partial-verified'
        run: |
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'QEMU_LD_PREFIX=/usr/aarch64-linux-gnu' >> "$GITHUB_ENV"
      - if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
      - if: contains(matrix.target, 'musl')
        run: cargo install cargo-zigbuild --locked
      - if: runner.os == 'Linux' && matrix.verification != 'partial-verified'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: matrix.verification == 'native'
        run: cargo test -p volund-sandbox --target ${{ matrix.target }}
      - if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build -p volund-sandbox --bin volund-sandbox --target ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: cargo zigbuild -p volund-sandbox --bin volund-sandbox --target ${{ matrix.target }}
      - if: matrix.verification == 'native-tier2'
        name: Run Windows Tier 2 AppContainer, ACL rollback, and escape suite
        shell: pwsh
        run: ./crates/volund-sandbox/tests/escape/windows-tier2.ps1 "target/${{ matrix.target }}/debug/volund-sandbox.exe"
      - if: matrix.verification == 'cross-verified'
        name: Run musl x64 escape suite on the host kernel
        run: bash crates/volund-sandbox/tests/escape/run.sh target/${{ matrix.target }}/debug/volund-sandbox
      - if: matrix.verification == 'native'
        name: Run upstream-derived sandbox smoke and escape suite
        run: bash crates/volund-sandbox/tests/escape/run.sh target/${{ matrix.target }}/debug/volund-sandbox
      - if: matrix.verification == 'partial-verified'
        name: Exercise QEMU binary and verify the documented namespace limitation
        run: |
          binary=target/${{ matrix.target }}/debug/volund-sandbox
          "$binary" --verify-bwrap-digest
          "$binary" --probe > qemu-probe.json
          set +e
          output=$(bash crates/volund-sandbox/tests/escape/run.sh "$binary" 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'Creating new namespace failed' <<<"$output"
          printf '%s\n' "$output" > qemu-escape-attempt.txt
      - name: Record verification evidence
        shell: bash
        run: |
          printf 'target=%s\nverification=%s\nrunner=%s\n' '${{ matrix.target }}' '${{ matrix.verification }}' '${{ runner.name }}' > escape-verification.txt
          if [ '${{ matrix.verification }}' = partial-verified ]; then
            printf 'status=qemu-runtime-limited\n' >> escape-verification.txt
            printf 'limitation=QEMU user-mode is not real arm64 hardware; stable release still requires the checklist hardware gate.\n' >> escape-verification.txt
          elif [ '${{ matrix.verification }}' = native-tier2 ]; then
            printf 'status=windows-tier2-passed\n' >> escape-verification.txt
            printf 'limitation=Partial tier: AppContainer isolates filesystem access, but per-host network filtering remains a Tier 3 capability.\n' >> escape-verification.txt
          else
            printf 'status=passed\n' >> escape-verification.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: escape-${{ matrix.target }}
          path: |
            escape-verification.txt
            qemu-probe.json
            qemu-escape-attempt.txt
