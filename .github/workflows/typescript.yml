name: TypeScript quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Type-aware Oxlint resolves workspace package exports from dist declarations.
      - run: pnpm turbo run build
      - run: pnpm lint
      - run: pnpm turbo run typecheck test
      - name: Verify legacy plugin containment and package boundary
        run: |
          pnpm --filter @apollo-code/plugin-runtime test -- src/index.test.ts
          pnpm --filter ./apps/cli exec vitest run src/architecture.test.ts src/runtime.test.ts
          node --test scripts/verify-plugin-runtime-packlist.test.mjs
