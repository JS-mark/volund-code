name: L1 TypeScript
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            turbo-concurrency: 100%
            node-version: 24
          - runner: macos-14
            turbo-concurrency: 100%
            node-version: 24
          # The Windows hosted runner can fail to initialize worker processes
          # (0xC0000142) under Node 24 even after workspace work is serialized.
          - runner: windows-2022
            turbo-concurrency: 1
            node-version: 22.13.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build --concurrency=${{ matrix.turbo-concurrency }}
      - name: Assert Rolldown single-bin output
        shell: bash
        run: |
          test -f apps/cli/dist/volund.js
          test "$(find apps/cli/dist -type f -name '*.js' | wc -l | tr -d ' ')" = 1
          head -n 1 apps/cli/dist/volund.js | grep -Fx '#!/usr/bin/env node'
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.runner }}
          path: apps/cli/dist/volund.js
