<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Volund CLI pixel hammer logo study</title>
  <desc id="desc">A bold forge-teal pixel hammer with a terminal prompt cut into its head.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#2bbd9b" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#06100f"/>
  <rect width="1200" height="700" fill="url(#scan)"/>
  <path d="M0 54H72M394 54H1200" stroke="#2bbd9b" stroke-width="3"/>
  <text x="92" y="64" fill="#2bbd9b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" letter-spacing="3">VOLUND CLI</text>
  <text x="330" y="64" fill="#78918c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">v0.1.0</text>

  <g opacity=".13" fill="#67a99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="55" y="148">inspect</text>
    <text x="65" y="192">permission</text>
    <text x="88" y="236">restore</text>
    <text x="976" y="166">context</text>
    <text x="1000" y="210">sandbox</text>
    <text x="948" y="254">provider</text>
    <text x="67" y="572">diff --check</text>
    <text x="930" y="582">tests passed</text>
  </g>

  <g fill="#2bbd9b">
    <path d="M310 180H890V260H930V430H870V470H650V590H550V470H330V430H270V260H310Z"/>
  </g>
  <rect x="350" y="270" width="500" height="150" fill="#06100f"/>

  <g fill="#2bbd9b">
    <path d="M455 308H495V328H515V348H535V368H515V388H495V408H455V388H475V368H495V348H475V328H455Z"/>
    <rect x="575" y="378" width="120" height="30"/>
  </g>

  <text x="442" y="635" fill="#dce9e5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" letter-spacing="6">FORGED FOR CODERS.</text>
</svg>
