<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Volund CLI</title>
  <desc id="desc">A bold forge-teal pixel hammer with a terminal prompt cut into its head.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#2bbd9b" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="18" fill="#06100f"/>
  <rect width="1200" height="480" rx="18" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="478" rx="17" fill="none" stroke="#2bbd9b" stroke-opacity=".16"/>

  <path d="M0 48H72M400 48H1200" stroke="#2bbd9b" stroke-width="2"/>
  <text x="92" y="58" fill="#2bbd9b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" letter-spacing="3">VOLUND CLI</text>
  <text x="333" y="58" fill="#78918c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">v0.1.0</text>

  <g opacity=".12" fill="#67a99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="48" y="132">inspect</text>
    <text x="62" y="170">permission</text>
    <text x="76" y="208">restore</text>
    <text x="1012" y="142">context</text>
    <text x="990" y="180">sandbox</text>
    <text x="1018" y="218">provider</text>
    <text x="55" y="414">diff --check</text>
    <text x="1000" y="420">tests passed</text>
  </g>

  <path fill="#2bbd9b" d="M330 105H870V160H910V310H850V340H640V420H560V340H350V310H290V160H330Z"/>
  <rect x="370" y="170" width="460" height="130" fill="#06100f"/>

  <g fill="#2bbd9b">
    <path d="M455 195H491V213H509V231H527V249H509V267H491V285H455V267H473V249H491V231H473V213H455Z"/>
    <rect x="575" y="258" width="112" height="27"/>
  </g>

  <text x="434" y="462" fill="#dce9e5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="6">FORGED FOR CODERS.</text>
</svg>
